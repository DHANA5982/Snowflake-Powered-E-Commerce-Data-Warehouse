name: Data Warehouse CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy dbt models to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Create dbt production profile
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          mkdir -p ~/.dbt
          printf '%s\n' \
            "ecommerce_dbt:" \
            "  target: prod" \
            "  outputs:" \
            "    prod:" \
            "      type: snowflake" \
            "      account: \"${SNOWFLAKE_ACCOUNT}\"" \
            "      user: \"${SNOWFLAKE_USER}\"" \
            "      password: \"${SNOWFLAKE_PASSWORD}\"" \
            "      role: \"${SNOWFLAKE_ROLE}\"" \
            "      warehouse: \"${SNOWFLAKE_WAREHOUSE}\"" \
            "      database: \"${SNOWFLAKE_DATABASE}\"" \
            "      schema: \"${SNOWFLAKE_SCHEMA}\"" \
            "      threads: 4" \
            > ~/.dbt/profiles.yml

      - name: Test production connection
        working-directory: ecommerce_dbt
        run: dbt debug --target prod

      - name: Deploy dbt models
        working-directory: ecommerce_dbt
        run: dbt run --target prod

      - name: Test deployed models
        working-directory: ecommerce_dbt
        run: dbt test --target prod