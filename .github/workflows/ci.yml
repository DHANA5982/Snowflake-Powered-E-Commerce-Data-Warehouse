name: Data Pipeline CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install dbt-snowflake

            - name: Validate Python syntax
              run: |
                python -m compileall src

            - name: Verify dbt installation
              run: |
                dbt --version

            - name: Create dbt profile
              env:
                SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
                SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
                SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
                SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
                SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
              run: |
                mkdir -p ~/.dbt
                printf '%s\n' \
                    "ecommerce_dbt:" \
                    "  target: ci" \
                    "  outputs:" \
                    "    ci:" \
                    "      type: snowflake" \
                    "      account: \"${SNOWFLAKE_ACCOUNT}\"" \
                    "      user: \"${SNOWFLAKE_USER}\"" \
                    "      password: \"${SNOWFLAKE_PASSWORD}\"" \
                    "      role: \"${SNOWFLAKE_ROLE}\"" \
                    "      warehouse: \"${SNOWFLAKE_WAREHOUSE}\"" \
                    "      database: \"${SNOWFLAKE_DATABASE}\"" \
                    "      schema: \"${SNOWFLAKE_SCHEMA}\"" \
                    "      threads: 4" \
                    > ~/.dbt/profiles.yml

            - name: Validate dbt profile structure
              run: |
                python - <<'PY'
                import yaml

                with open("/home/runner/.dbt/profiles/yml") as f
                    profile = yaml.safe_load(f)
                
                config = profile["ecommerce_dbt"]

                assert config["target"] == "ci"
                assert "ci" in config["outputs"]
                assert config["outputs"]["ci"]["type"] == "snowflake"

                print("dbt profile structure is valid")
                py

            - name: Test Snowflake connection
              working-directory: ecommerce_dbt
              run: |
                dbt debug

            - name: Parse dbt project
              working-directory: ecommerce_dbt
              run: |
                dbt parse