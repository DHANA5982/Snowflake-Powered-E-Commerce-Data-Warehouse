version: 2

models:

  - name: dim_customers

    description: >
      Customer dimension containing the latest deduplicated customer information
      used for analytical reporting.


    columns:

      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: "Customer first name."

      - name: last name
        description: "Customer last name."

      - name: email
        description: "Customer email address."
        data_tests:
          - not_null

      - name: country
        description: "Customer country."
        data_tests:
          - not_null

      - name: created_at
        description: "Date and time when the customer was originally created."

  - name: dim_products

    description: "Product dimension containing product available for sales."

    columns:

      - name: product_id
        description: "unique identifier for the product."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Name of the product."
        data_tests:
          - not_null

      - name: price
        description: "Current product price."
        data_tests:
          - not_null

      - name: category
        description: "Product category."
        data_tests:
          - not_null

  - name: fact_sales
    
    description: "Sales fact table at order-item grain."

    columns:

      - name: order_item_id
        description: "Unique identifier for an order line."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: product_id
        description: "Identifier of the purchased product."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: order_date
        description: "Date on which the order was placed."
        data_tests:
          - not_null

  - name: fact_sales_incremental
    
    description: > 
      Sales fact table at order-item grain.
      Each row represents one product line within a customer order.

    columns:

      - name: order_item_id
        description: "Unique identifier for an order line."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: product_id
        description: "Identifier of the purchased product."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: order_date
        description: "Date on which the order was placed."
        data_tests:
          - not_null

      - name: status
        description: "Current status of the order."

      - name: quantity
        description: "Number of units purchased."

      - name: unit_price
        description: "Price per unite at the time of purchase."

      - name: sales_amount
        description: "Calculated sales value: quantity multiplied by unit price."

      - name: _ingestion_timestamp
        description: >
          Timestamp representing the latest ingestion event contributing
          to the fact record.